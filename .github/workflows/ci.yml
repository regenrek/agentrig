name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@45e5c098f1095cc6b65fd92534603e7be70386c1
        with:
          node-version: 24
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check
        run: vp run repo:check

      - name: Typecheck CLI
        run: vp run repo:typecheck:cli

      - name: Build CLI
        run: vp run repo:build:cli

      - name: Build docs
        run: vp run repo:docs:build
