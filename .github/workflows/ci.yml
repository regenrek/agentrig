name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: voidzero-dev/setup-vp@ee6805d1c428a397d5c7d3fa4111f8a7e5af2136
        with:
          node-version: 24
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check
        run: vp run repo:check

      - name: Typecheck CLI
        run: vp run repo:typecheck:cli

      - name: Build CLI
        run: vp run repo:build:cli

      - name: Build docs
        run: vp run repo:docs:build
