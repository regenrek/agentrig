name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: voidzero-dev/setup-vp@ee6805d1c428a397d5c7d3fa4111f8a7e5af2136
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run repo:coverage

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: voidzero-dev/setup-vp@ee6805d1c428a397d5c7d3fa4111f8a7e5af2136
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run repo:test:e2e

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: voidzero-dev/setup-vp@ee6805d1c428a397d5c7d3fa4111f8a7e5af2136
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run repo:test:release:smoke

  node-canary-smoke:
    name: Node 25 canary smoke
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: voidzero-dev/setup-vp@ee6805d1c428a397d5c7d3fa4111f8a7e5af2136
        with:
          node-version: 25
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run repo:test:release:smoke
